/* ===== STYLES: screen overlay, CRT effect, buttons, touch controls ===== */
html,body{margin:0;height:100%;overflow:hidden;background:#0d0a1f}
:root {

  --arcade-lime: oklch(0.9 0.22 130);
  --arcade-ink: oklch(0.95 0.02 290);
}
.arcade-root { position: fixed; inset: 0; overflow: hidden; background: var(--arcade-bg); touch-action: none; user-select: none; -webkit-user-select: none; overscroll-behavior: none; font-family: ui-monospace, "Courier New", monospace; }
.arcade-canvas { position: absolute; inset: 0; image-rendering: pixelated; }
.arcade-crt { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, oklch(0 0 0 / 0.22) 0 1px, transparent 1px 3px); box-shadow: inset 0 0 120px oklch(0 0 0 / 0.7), inset 0 0 30px color-mix(in oklab, var(--arcade-magenta) 25%, transparent); }
.arcade-chip { position: absolute; top: 10px; padding: 6px 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: var(--arcade-ink); background: var(--arcade-bg); border: 2px solid var(--arcade-cyan); box-shadow: 3px 3px 0 var(--arcade-magenta); cursor: pointer; z-index: 5; }
.arcade-sound { right: 10px; top: auto; bottom: 10px; }
.arcade-fullscreen { left: 10px; }
.arcade-pause { left: 50%; transform: translateX(-50%); top: auto; bottom: 10px; }
.arcade-start { position: absolute; left: 50%; bottom: 8%; transform: translateX(-50%); padding: 12px 34px; font-size: 18px; font-weight: 900; letter-spacing: 0.25em; color: var(--arcade-bg); background: var(--arcade-lime); border: 3px solid var(--arcade-ink); box-shadow: 5px 5px 0 var(--arcade-magenta), 0 0 24px color-mix(in oklab, var(--arcade-lime) 50%, transparent); cursor: pointer; z-index: 5; animation: arcade-pulse 1.2s steps(2) infinite; }
.arcade-screen-actions { position: absolute; left: 50%; bottom: 8px; display: flex; gap: 10px; transform: translateX(-50%); z-index: 7; }
.arcade-screen-action { min-width: 104px; padding: 8px 12px; color: var(--arcade-ink); background: var(--arcade-bg); border: 2px solid var(--arcade-cyan); box-shadow: 3px 3px 0 var(--arcade-magenta); font: 700 11px ui-monospace, "Courier New", monospace; letter-spacing: 0.1em; cursor: pointer; touch-action: manipulation; }
.arcade-screen-action:first-child { color: var(--arcade-bg); background: var(--arcade-lime); border-color: var(--arcade-ink); }
.arcade-screen-action:hover { filter: brightness(1.15); }
.arcade-screen-action:focus-visible { outline: 3px solid var(--arcade-amber); outline-offset: 3px; }
.arcade-stage-select { position: absolute; inset: 0; z-index: 6; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(5,4,15,0.38); }
.arcade-stage-panel { width: min(390px, 100%); padding: 18px; background: rgba(8,6,28,0.94); border: 3px solid var(--arcade-cyan); box-shadow: 6px 6px 0 var(--arcade-magenta); text-align: center; }
.arcade-stage-heading { margin: 0 0 14px; color: var(--arcade-lime); font-size: 18px; font-weight: 900; }
.arcade-stage-options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.arcade-stage-option { min-width: 0; min-height: 94px; padding: 10px 6px; color: var(--arcade-ink); background: #12152a; border: 2px solid var(--arcade-cyan); box-shadow: 3px 3px 0 #0b0820; font: 700 10px ui-monospace, "Courier New", monospace; cursor: pointer; touch-action: manipulation; }
.arcade-stage-option:nth-child(2) { background: #242017; border-color: var(--arcade-amber); }
.arcade-stage-option[aria-pressed="true"] { outline: 2px solid var(--arcade-lime); outline-offset: 2px; }
.arcade-stage-number, .arcade-stage-name, .arcade-stage-setting { display: block; }
.arcade-stage-number { margin-bottom: 7px; color: var(--arcade-amber); }
.arcade-stage-name { color: #ffffff; font-size: 13px; }
.arcade-stage-setting { margin-top: 6px; color: var(--arcade-cyan); font-size: 9px; }
.arcade-stage-back { margin-top: 14px; min-width: 112px; padding: 8px 12px; color: var(--arcade-ink); background: transparent; border: 2px solid var(--arcade-magenta); font: 700 10px ui-monospace, "Courier New", monospace; cursor: pointer; touch-action: manipulation; }
.arcade-stage-option:focus-visible, .arcade-stage-back:focus-visible { outline: 3px solid var(--arcade-lime); outline-offset: 3px; }
@keyframes arcade-pulse { 50% { box-shadow: 5px 5px 0 var(--arcade-cyan), 0 0 40px color-mix(in oklab, var(--arcade-lime) 70%, transparent); } }
.arcade-controls { position: absolute; left: 0; right: 0; bottom: 48px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 18px; z-index: 4; pointer-events: none; }
.arcade-dpad { pointer-events: auto; width: 132px; height: 132px; border-radius: 50%; background: color-mix(in oklab, var(--arcade-bg) 60%, transparent); border: 3px solid var(--arcade-cyan); position: relative; touch-action: none; }
.arcade-dpad-cross { position: absolute; inset: 0; background: linear-gradient(var(--arcade-cyan), var(--arcade-cyan)) center / 36px 100px no-repeat, linear-gradient(var(--arcade-cyan), var(--arcade-cyan)) center / 100px 36px no-repeat; opacity: 0.35; border-radius: 50%; }
.arcade-buttons { pointer-events: auto; display: grid; grid-template-columns: repeat(2, 64px); gap: 10px; }
.arcade-touch { width: 64px; height: 64px; border-radius: 50%; font-size: 13px; font-weight: 900; color: var(--arcade-bg); border: 3px solid var(--arcade-ink); touch-action: none; }
.arcade-touch:active { transform: scale(0.92); }
.arcade-touch-hit { background: var(--arcade-magenta); grid-column: 2; grid-row: 2; width: 74px; height: 74px; }
.arcade-touch-jump { background: var(--arcade-amber); grid-column: 1; grid-row: 2; }
.arcade-touch-sp { background: var(--arcade-cyan); grid-column: 2; grid-row: 1; }
.arcade-touch-interact { background: var(--arcade-lime); grid-column: 1; grid-row: 1; }

    stageSelect.style.display = s === "stageselect" ? "flex" : "none";
    stageButtons.forEach((button, index) => button.setAttribute("aria-pressed", index === g.stageSelection ? "true" : "false"));
    ctr.style.display = touch && s === "playing" ? "" : "none";
  };
  g.onStageSelection = (index) => stageButtons.forEach((button, buttonIndex) => button.setAttribute("aria-pressed", buttonIndex === index ? "true" : "false"));
  g.onScreen = upd;
  upd("title");
  g.audio.startMusic("menu");
})();

</script>
